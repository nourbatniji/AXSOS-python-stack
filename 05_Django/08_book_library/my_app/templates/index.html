<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="{% static 'script.js' %}"></script>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
    <header>
        <div class="container">
            <form action="/reg_user" method="post" onsubmit="return signup_validation()" class="reg">
                {% csrf_token %}
                <h2>Registration</h2>
                <div class="mb-3">
                    <label for="first_name">First Name</label>
                    <input type="text" name="first_name" id="first_name">
                </div>
                <div class="mb-3">
                    <label for="last_name">Last Name</label>
                    <input type="text" name="last_name" id="last_name">
                </div>
                <div class="mb-3">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email">
                </div>
                <div class="mb-3">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password">
                </div>
                <div class="mb-3">
                    <label for="confirm_pw">Confirm PW</label>
                    <input type="password" name="confirm_pw" id="confirm_pw">
                </div>
                <div><button>Register</button></div>
            </form>

            <form action="/login_user" method="post" onsubmit="return login_validation()" class="login">
                {% csrf_token %}
                <h2>Login</h2>
                <div class="mb-3">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="login-email">
                </div>
                <div class="mb-3">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="login-password">
                </div>
                <div><button>Log In</button></div>
            </form>
            <br>
        </div>
        <div class="w-75 text-danger m-auto">
            {% if messages %}
            <ul>
                {% for message in messages %}
                <li class="fw-normal">{{ message }}</li>
                {% endfor %}
            </ul>
            {% endif %}
        </div>

    </header>

</body>

</html>
