<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojos & Ninjas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    <header>
        <div class="container d-flex justify-content-center align-items-center bg-secondary w-75 m-auto">
            <form action="/add_dojo" method="post">
                <h3>Add a Dojo</h3>
                {% csrf_token %}
                <div class="mb-3">
                    <label for="dojo_name">Name</label>
                    <input type="text" name="dojo_name" id="dojo_name">
                </div>
                <div class="mb-3">
                    <label for="city">City</label>
                    <input type="text" name="city" id="city">
                </div>
                <div class="mb-3">
                    <label for="state">State</label>
                    <input type="text" name="state" id="state">
                </div>
                <div>
                    <button>Add</button>
                </div>
            </form>

            <form action="/add_ninja" method="post">
                {% csrf_token %}
                <h3>Add a Ninja</h3>
                <div class="mb-3">
                    <label for="first_name">First Name</label>
                    <input type="text" name="first_name" id="first_name">
                </div>
                <div class="mb-3">
                    <label for="last_name">Last Name</label>
                    <input type="text" name="last_name" id="last_name">
                </div>
                <div class="mb-3">
                    <label for="dojo">Dojo</label>
                    <select name="dojo_id" id="dojo_id">
                        {% for dojo in all_dojos %}
                        <option value="{{ dojo.id }}">{{ dojo.dojo_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <button>Add</button>
                </div>
            </form>
        </div>
    </header>
    <section>
        <div class="container">
            <h1>All the Dojos</h1>
            <ul>
                {% for dojo in all_dojos %}
                <li>{{ dojo.dojo_name }}
                    <form action="/delete" method="post">
                         {% csrf_token %}
                         <input type="hidden" name="dojo_id" id="dojo_id" value="{{ dojo.id }}">
                        <button>Delete</button>
                    </form>

                    <ul>
                        {% for ninja in dojo.ninjas.all %}
                        <li>
                                {{ ninja.first_name }}{{ ninja.last_name }}
                            </li>
                            {% endfor %}
                        
                    </ul>
                </li>
                {% endfor %}
            </ul>
        </div>
    </section>
</body>

</html>
