<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <section>
        <div class="container">
            <h1>All Users:</h1>
            <table class="table table-striped">
                <thead>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Created at</th>
                    <th>Actions</th>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr>
                        <td><a href="/user_details/{{ user.id }}">{{ user.id }}</a></td>
                        <td>{{ user.first_name }}</td>
                        <td>{{ user.last_name }}</td>
                        <td>{{ user.email }}</td>
                        <td>{{ user.created_at }}</td>
                        <td>
                            <!-- delete -->
                            <form action="/delete_user" method="post">
                                {% csrf_token %}
                                <input type="hidden" name="user_id" id="user_id" value="{{ user.id }}">
                                <button>Delete</button>
                            </form>
                            <!-- update -->
                            <button><a href="/update_page/{{ user.id }}">Edit</a></button>
                            <!-- add address -->
                            <a href="/addresses/{{ user.id }}">Add Address to this user</a>
                            <!-- user addresses -->
                            <a href="/user_addresses/{{ user.id }}">Add Address to this user</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            <a href="/homepage">Home</a>
            <a href="/sign_out">signout</a>
            </div>
    </section>
</body>

</html>
