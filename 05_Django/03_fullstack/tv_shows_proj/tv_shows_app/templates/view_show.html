<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Show</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container w-50 py-5 my-5">
    <a href="/shows" class="go-back">Go Back</a>
        <h1>TV Show {{ show.id }}</h1>
        <h5>Title: {{ show.title }}</h5>
        <h5>Network: {{ show.network }}</h5>
        <h5>Release Date: {{ show.release_date }}</h5>
        <h5 class="pb-5">Description: {{ show.desc }}</h5>


        <h5 class="pt-5">Last Updated: {{ show.updated_at|date:'F d, Y g:i a' }} </h5> 

        <a href="/shows/{{ show.id }}/edit">Edit</a>
        |
        <a href="/shows/{{ show.id }}/destroy">Delete</a>

    </div>
</body>

</html>
